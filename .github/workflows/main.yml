name: Azure Login Test

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  login-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Login
        run: az account show --output table
