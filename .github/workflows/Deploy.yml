name: Deploy Resource Group

on:
  workflow_dispatch:

  push:
    branches:
      - main


jobs:
  deploy-rg:
    runs-on: ubuntu-latest

    env:
      LOCATION: westus
      PARAM_FILE: Parameters/dev.bicepparam

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep
        run: |
          az bicep install

      - name: Bicep Build
        run: |
          az bicep build \
            --file main.bicep

      - name: Validate Parameter File
        run: |
          az bicep build-params \
            --file $PARAM_FILE

      - name: ARM Subscription Validation
        run: |
          az deployment sub validate \
            --location $LOCATION \
            --template-file main.bicep \
            --parameters $PARAM_FILE

      - name: What If Analysis
        run: |
          az deployment sub what-if \
            --location $LOCATION \
            --template-file main.bicep \
            --parameters $PARAM_FILE

      - name: Deploy Resource Group
        run: |
          az deployment sub create \
            --location $LOCATION \
            --template-file main.bicep \
            --parameters $PARAM_FILE
